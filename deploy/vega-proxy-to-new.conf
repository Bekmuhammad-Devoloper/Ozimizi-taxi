# MOVIY TAXI — Vega (62.171.184.14) AFTER the cutover to the Eskiz server.
# Replaces /etc/nginx/sites-available/moviytaxi on Vega: every request for the
# Moviy Taxi hostnames is forwarded to the new server, so clients whose DNS
# cache still points at Vega (and the old-domain APKs) keep working.
# Apply:  cp vega-proxy-to-new.conf /etc/nginx/sites-available/moviytaxi && nginx -t && systemctl reload nginx
# (HTTP/2 deliberately NOT enabled: the 443 socket is shared with other sites.)

server {
    listen 80;
    server_name moviytaxi.uz www.moviytaxi.uz moviytaxi.yuksalish.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name moviytaxi.uz www.moviytaxi.uz moviytaxi.yuksalish.dev;
    ssl_certificate /etc/letsencrypt/live/moviytaxi.yuksalish.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moviytaxi.yuksalish.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20M;

    # Builds published by deploy/build-on-vega.sh for the VPS to pull
    # (reachable only via the old hostname, whose DNS still points here;
    # the per-server random token in the path keeps it private).
    location ^~ /_build- {
        alias /opt/moviytaxi/build/out/;
        autoindex off;
    }

    location / {
        proxy_pass https://189.74.100.34;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}
