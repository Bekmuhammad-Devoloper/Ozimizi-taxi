# MOVIY TAXI — TEMPORARY site for the new Eskiz server (189.74.100.34) while
# the apps are still being built/restored there: DNS already points here, so
# forward everything to Vega (62.171.184.14), which still runs the live system.
# Replaced by Vega's real site config (migrate/nginx-moviytaxi.conf) at cutover.

server {
    listen 80;
    server_name moviytaxi.uz www.moviytaxi.uz moviytaxi.yuksalish.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name moviytaxi.uz www.moviytaxi.uz moviytaxi.yuksalish.dev;
    ssl_certificate /etc/letsencrypt/live/moviytaxi.yuksalish.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moviytaxi.yuksalish.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 20M;

    location / {
        proxy_pass https://62.171.184.14;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}
