name: moviy_driver
description: Moviy Taxi haydovchi ilovasi
publish_to: none
version: 2.0.3+23

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_map: ^7.0.0
  geolocator: ^13.0.0
  image_picker: ^1.1.0
  latlong2: ^0.9.0
  package_info_plus: ^8.0.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  socket_io_client: ^3.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/img/default_avatar.jpg
    - assets/img/taximeter.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
